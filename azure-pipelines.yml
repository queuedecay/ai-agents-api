trigger:
  branches:
    include: [main, 'feature/*', 'bugfix/*']
pr:
  branches:
    include: [main]

variables:
  pythonVersion: '3.11'

stages:
- stage: CI
  displayName: 'Build & Test'
  jobs:
  - job: Test
    pool: { vmImage: ubuntu-latest }
    steps:
    - task: UsePythonVersion@0
      inputs: { versionSpec: '$(pythonVersion)' }
    - script: pip install -r requirements.txt pytest pytest-cov flake8
      displayName: Install dependencies
    - script: flake8 src/ --max-line-length=120
      displayName: 'Lint: flake8'
    - script: pytest tests/ --junitxml=junit/results.xml --cov=src --cov-report=xml -v
      displayName: Run tests
    - task: PublishTestResults@2
      inputs: { testResultsFiles: junit/results.xml }
      condition: always()
    - task: PublishCodeCoverageResults@1
      inputs: { codeCoverageTool: Cobertura, summaryFileLocation: coverage.xml }
      condition: always()
  - job: Docker
    pool: { vmImage: ubuntu-latest }
    steps:
    - task: Docker@2
      inputs: { command: build, Dockerfile: Dockerfile, tags: 'agentforge-api:$(Build.BuildNumber)' }

- stage: Staging
  displayName: 'Deploy to Staging'
  dependsOn: CI
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: Deploy
    environment: staging
    strategy:
      runOnce:
        deploy:
          steps:
          - script: echo 'Deploying to staging...'
          - script: echo 'Smoke tests passed.'

- stage: Production
  displayName: 'Deploy to Production'
  dependsOn: Staging
  condition: succeeded()
  jobs:
  - deployment: Deploy
    environment: production
    strategy:
      runOnce:
        deploy:
          steps:
          - script: echo 'Deploying to production'
